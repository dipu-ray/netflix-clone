<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character Encoding & Browser Compatibility -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Metadata -->
    <title>Netflix Bangladesh - Watch TV Shows Online, Watch Movies Online</title>
    <meta name="description"
        content="Watch Netflix clones movies and TV shows online or stream right to your browser. A frontend HTML and CSS practice project mimicking the ultimate streaming experience.">
    <meta name="keywords"
        content="Netflix Clone, HTML CSS project, frontend development, stream movies online, responsive UI clone, web design portfolio">
    <meta name="author" content="Dipu Ray">
    <meta name="robots" content="index, follow">

    <!-- Netflix Favicon -->
    <link rel="shortcut icon" href="assets/images/icon.webp" type="image/x-icon">

    <!-- "Inter" Google Font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- To link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="container navbar">
            <div class="logo">
                <img src="assets/images/logo.png" alt="Netflix Logo">
            </div>
            <div class="signin-btn">
                <a href="#x">Sign In</a>
            </div>
        </nav>

        <!-- Home Section -->
        <section class="container home-section">
            <h1>Unlimited movies, TV shows, and more</h1>
            <h4>Starts at USD 2.99. Cancel anytime.</h4>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <form class="email-form" action="#" method="POST">
                <input type="email" placeholder="Email Address" required>
                <button type="submit">
                    Get Started
                    <i class="fa-solid fa-angle-right"></i>
                </button>
            </form>
        </section>
    </header>

    <!-- Red Line - Divide -->
    <div class="divide">
        <div class="inner-divide"></div>
    </div>

    <!-- Main -->
    <main>

        <!-- Trending Section -->
        <section class="container trending-section">
            <h2>Trending Now</h2>
            <div class="trending-cards">
                <div class="card">
                    <a href="#x">
                        <div class="serial">1</div>
                        <img src="assets/images/trend-1.webp" alt="Movies Thumbnail">
                    </a>
                </div>
                <div class="card">
                    <a href="#x">
                        <div class="serial">2</div>
                        <img src="assets/images/trend-2.webp" alt="Movies Thumbnail">
                    </a>
                </div>
                <div class="card">
                    <a href="#x">
                        <div class="serial">3</div>
                        <img src="assets/images/trend-3.webp" alt="Movies Thumbnail">
                    </a>
                </div>
                <div class="card">
                    <a href="#x">
                        <div class="serial">4</div>
                        <img src="assets/images/trend-4.webp" alt="Movies Thumbnail">
                    </a>
                </div>
                <div class="card">
                    <a href="#x">
                        <div class="serial">5</div>
                        <img src="assets/images/trend-5.webp" alt="Movies Thumbnail">
                    </a>
                </div>
                <div class="card">
                    <a href="#x">
                        <div class="serial">6</div>
                        <img src="assets/images/trend-6.webp" alt="Movies Thumbnail">
                    </a>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
