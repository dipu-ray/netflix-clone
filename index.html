<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Bangladesh - Watch TV Shows Online, Watch Movies Online</title>

    <!-- Netflix Favicon -->
    <link rel="shortcut icon" href="assets/images/icon.webp" type="image/x-icon">

    <!-- "Inter" Google Font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- To link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="container navbar">
            <div class="logo">
                <img src="assets/images/logo.png" alt="Netflix Logo">
            </div>
            <div class="signin-btn">
                <a href="#x">Sign In</a>
            </div>
        </nav>

        <!-- Home Section -->
        <section class="container home-section">
            <h1>Unlimited movies, TV shows, and more</h1>
            <h4>Starts at USD 2.99. Cancel anytime.</h4>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <form class="email-form" action="#" method="POST">
                <input type="email" placeholder="Email Address" required>
                <button type="submit">Get Started ></button>
            </form>
        </section>
    </header>

</body>

</html>
